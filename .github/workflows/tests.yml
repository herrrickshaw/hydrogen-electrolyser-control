name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requests (used only by the example client) is faked in the tests, so it is not installed.
      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-randomly Flask==3.0.0 Flask-CORS==4.0.0 numpy
      - name: Run tests with coverage
        run: pytest tests --cov --cov-config=.coveragerc --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
